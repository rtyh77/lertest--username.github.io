<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر التجميل والعطور</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- تسريع الاتصال بسيرفرات الصور و Firebase -->
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://images.unsplash.com">

    <style>
        :root {
            --accent-gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --dark-overlay: rgba(10, 14, 23, 0.82);
            --card-glass: rgba(15, 23, 42, 0.75);
            --card-border: rgba(212, 175, 55, 0.25);
        }

        body {
            margin: 0;
            padding: 0;
            background-image: 
                linear-gradient(var(--dark-overlay), var(--dark-overlay)),
                url('https://images.unsplash.com/photo-1547887537-6158d64c35b3?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #f8fafc;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
        }

        header {
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .delivery-badge {
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        #cartBtn {
            background: var(--gold-gradient);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
            min-height: 300px;
        }

        .product-card {
            background: var(--card-glass) !important;
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border) !important;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #1e293b;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .product-title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .product-price {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .add-to-cart-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--accent-gold);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-to-cart-btn:hover {
            background: var(--accent-gold);
            color: #000;
        }

        /* نافذة السلة والشحن (Modals) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid var(--accent-gold);
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--accent-gold);
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
        }

        .btn-submit, .btn-cancel {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-submit { background: var(--accent-gold); color: #000; }
        .btn-cancel { background: #334155; color: #fff; }

        /* فقاعة الواتساب العائمة */
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 52px;
            height: 52px;
            background-color: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 4px 16px rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        .whatsapp-float svg { width: 30px; height: 30px; fill: #ffffff; }
    </style>
</head>
<body>

    <header>
        <h1>لمسة جمال</h1>
        <div class="delivery-badge">🚚 التوصيل متوفر 58 ولاية</div>
        <button id="cartBtn">
            🛒 السلة (<span id="cartCount">0</span>)
        </button>
    </header>

    <main class="products-grid" id="productsGrid">
        <p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding:40px;">جاري تحميل المنتجات...</p>
    </main>

    <!-- نافذة سلة المشتريات -->
    <div id="cartModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>🛍️ سلة المشتريات</h3>
            <div id="cartItems" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:15px;">
                <span>الإجمالي:</span>
                <span id="totalAmount" style="color: var(--accent-gold);">0 د.ج</span>
            </div>
            <button id="checkoutBtn" class="btn-submit">تأكيد الطلب 🛒</button>
            <button id="closeCart" class="btn-cancel" style="margin-top:8px;">إغلاق</button>
        </div>
    </div>

    <!-- نافذة معلومات الشحن والزبون -->
    <div id="checkoutModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>📋 معلومات الشحن</h3>
            <form id="orderForm">
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" id="custName" required placeholder="أدخل اسمك الكامل">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="tel" id="custPhone" required placeholder="06XXXXXXXX">
                </div>
                <div class="form-group">
                    <label>الولاية والعنوان:</label>
                    <input type="text" id="custAddress" required placeholder="أدخل الولاية والبلدية">
                </div>
                <button type="submit" class="btn-submit">إرسال الطلب الآن 📲</button>
                <button type="button" id="cancelOrder" class="btn-cancel" style="margin-top:8px;">إلغاء</button>
            </form>
        </div>
    </div>

    <!-- فقاعة الواتساب العائمة -->
    <a href="https://wa.me/+213656708603" class="whatsapp-float" target="_blank" aria-label="تواصل معنا عبر الواتساب">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
            <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3 18.6-68.1-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.9-186.6 184.9zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
        </svg>
    </a>

    <!-- تحميل الجافاسكربت الخاص بالمتجر كـ Module مع كسر الكاش v=2.0 -->
    <script type="module" src="script.js?v=2.0"></script>
</body>
</html>
